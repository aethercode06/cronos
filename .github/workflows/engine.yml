name: Aether Engine (prueba de Chronos)
on:
  push:
    branches: [ main ]
    paths: [ 'engine/**', '.github/workflows/engine.yml' ]
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Descargar Godot y plantillas de exportación
        run: |
          V=$GODOT_VERSION
          cd $RUNNER_TEMP
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          unzip -q Godot_v${V}-stable_linux.x86_64.zip
          sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q Godot_v${V}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${V}.stable/
          godot --version
      - name: Configurar Android en el editor
        run: |
          MM=$(echo $GODOT_VERSION | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${MM}.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/engine/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          sed -i 's/^ *//' ~/.config/godot/*.tres
          cat ~/.config/godot/editor_settings-4.tres
      - name: Importar el proyecto
        run: |
          godot --headless --path engine --import 2>&1 | tee import.log || true
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log
      - name: Prueba automática (nivel + jefe)
        run: |
          timeout 300 godot --headless --path engine res://tests/smoke.tscn 2>&1 | tee smoke.log
          grep -q "AETHER: SMOKE OK" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log
      - name: Capturas de pantalla (render por software)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" godot --path engine --rendering-method gl_compatibility --rendering-driver opengl3 res://tests/smoke.tscn -- --shots 2>&1 | tail -40
          ls -la engine_shots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-shots
          path: |
            engine_shots/
            smoke.log
            import.log
      - name: Exportar APK de Android
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/engine/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" engine/export_presets.cfg
          godot --headless --path engine --export-debug "Android" ../build/AetherEngine-Chronos.apk 2>&1 | tail -30
          ls -la build
          test -s build/AetherEngine-Chronos.apk
      - name: Publicar en Descargas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aether-engine -y --cleanup-tag || true
          gh release create aether-engine build/AetherEngine-Chronos.apk \
            --title "Aether Engine · prueba de Chronos 0.1.${{ github.run_number }}" \
            --notes "Primera prueba de **Aether Engine** (sobre Godot ${GODOT_VERSION}): Mundo 1 de Chronos y el Gran Sapo Ancestral animado. Toca **AetherEngine-Chronos.apk** para instalarlo (se instala aparte de Chronos)." \
            --latest=false
          for i in 1 2 3 4 5; do
            gh release edit aether-engine --draft=false || true
            sleep 4
            if [ "$(gh release view aether-engine --json isDraft -q .isDraft)" = "false" ]; then echo "publicada"; break; fi
          done

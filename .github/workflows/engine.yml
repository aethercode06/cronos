name: Aether Engine (prueba de Chronos)
on:
  push:
    branches: [ main ]
    paths: [ 'engine/**', '.github/workflows/engine.yml' ]
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Descargar Godot y plantillas de exportación
        run: |
          V=$GODOT_VERSION
          cd $RUNNER_TEMP
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          unzip -q Godot_v${V}-stable_linux.x86_64.zip
          sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q Godot_v${V}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${V}.stable/
          godot --version
      - name: Configurar Android en el editor
        run: |
          MM=$(echo $GODOT_VERSION | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${MM}.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/engine/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          sed -i 's/^ *//' ~/.config/godot/*.tres
          cat ~/.config/godot/editor_settings-4.tres
      - name: Importar el proyecto
        run: |
          godot --headless --path engine --import > import.log 2>&1 || true
          tail -60 import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log
      - name: Revisar todos los scripts
        run: |
          godot --headless --path engine -s res://tests/check_scripts.gd > check.log 2>&1 || true
          grep -E "SCRIPT ERROR|Parse Error|AETHER" check.log | head -60
      - name: Prueba automática (nivel + jefe)
        run: |
          timeout 300 godot --headless --path engine res://tests/smoke.tscn > smoke.log 2>&1 || true
          tail -40 smoke.log
          grep -q "AETHER: SMOKE OK" smoke.log
          grep -q "plantilla carga = true" smoke.log
          grep -q "personaje por piezas = 3 huesos" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log
      - name: Prueba de las plantillas y los juegos por género
        run: |
          timeout 500 godot --headless --path engine res://tests/templates.tscn > templates.log 2>&1 || true
          tail -30 templates.log
          grep -q "AETHER: TEMPLATES OK" templates.log
          grep -q "AETHER: LOGICA OK" templates.log
          grep -q "AETHER: sistemas OK" templates.log
          grep -q "AETHER: GENEROS OK" templates.log
          ! grep -E "SCRIPT ERROR|Parse Error" templates.log
      - name: Capturas de pantalla (render por software)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" godot --path engine --rendering-method gl_compatibility --rendering-driver opengl3 res://tests/smoke.tscn -- --shots > shots.log 2>&1 || true
          tail -40 shots.log
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path engine --rendering-method gl_compatibility --rendering-driver opengl3 res://tests/templates.tscn -- --shots > shots2.log 2>&1 || true
          tail -20 shots2.log
          ls -la engine_shots || true
      - name: Exportar APK de Android
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/engine/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" engine/export_presets.cfg
          godot --headless --path engine --export-debug "Android" ../build/AetherEngine-Chronos.apk > export.log 2>&1 || true
          tail -30 export.log
          ls -la build
          test -s build/AetherEngine-Chronos.apk
      - name: Publicar en Descargas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aether-engine -y --cleanup-tag || true
          gh release create aether-engine build/AetherEngine-Chronos.apk \
            --title "Aether Engine · prueba de Chronos 0.1.${{ github.run_number }}" \
            --notes "Primera prueba de **Aether Engine** (sobre Godot ${GODOT_VERSION}): Mundo 1 de Chronos y el Gran Sapo Ancestral animado. Toca **AetherEngine-Chronos.apk** para instalarlo (se instala aparte de Chronos)." \
            --latest=false
          for i in 1 2 3 4 5; do
            gh release edit aether-engine --draft=false || true
            sleep 4
            if [ "$(gh release view aether-engine --json isDraft -q .isDraft)" = "false" ]; then echo "publicada"; break; fi
          done
      - name: Actualizar el proyecto inicial del editor (zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd engine && zip -qr ../AetherEngine-Proyecto.zip . -x ".godot/*" "keys/*" "branding/*" && cd ..
          gh release upload aether-editor AetherEngine-Proyecto.zip --clobber || echo "aún no existe la versión del editor"
      - name: Prueba del asistente de publicación e idiomas
        run: |
          timeout 200 godot --headless --path engine res://tests/publish.tscn > publish.log 2>&1 || true
          tail -30 publish.log
          grep -q "AETHER: PUBLICAR OK" publish.log
          ! grep -E "SCRIPT ERROR|Parse Error" publish.log
      - name: Prueba del AAB para Google Play (gradle)
        continue-on-error: true
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/engine/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          godot --headless --path engine --install-android-build-template > aab.log 2>&1 || true
          timeout 1200 godot --headless --path engine --export-release "Android AAB" ../build/prueba.aab >> aab.log 2>&1 || true
          tail -40 aab.log
          ls -la build
          test -s build/prueba.aab && echo "AETHER: AAB OK" | tee -a aab.log
      - name: Guardar registros y capturas en la rama aether-logs
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r engine_shots /tmp/out/ 2>/dev/null || true
          cp *.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b aether-logs
          git config user.name "aether-ci" && git config user.email "ci@aethercode.local"
          git add -A && git commit -qm "Registros de la ejecución ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aether-logs

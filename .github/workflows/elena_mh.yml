name: Elena con MakeHuman (MPFB)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/tools/elena_mh/**", ".github/workflows/elena_mh.yml"]
permissions:
  contents: write
jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engine/tools/elena_mh
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Blender (bpy) y librerías del sistema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q bpy
      - name: MPFB y recursos CC0
        run: |
          set +e
          mkdir -p out/elena; exec > >(tee out/elena/instalacion.txt) 2>&1
          git clone -q --depth 1 https://github.com/makehumancommunity/mpfb2 /tmp/mpfb2
          (cd /tmp/mpfb2/src && zip -qr /tmp/mpfb.zip mpfb) ; ls -la /tmp/mpfb.zip
          mkdir -p /tmp/rec /tmp/zips
          git fetch -q origin aether-mh:aether-mh; echo "fetch $?"
          for z in makehuman_system_assets_cc0 hair01_cc0 skins01_cc0; do
            for p in aa ab ac ad; do git show aether-mh:$z.zip.part_$p 2>/dev/null; done > /tmp/zips/$z.zip
            ls -la /tmp/zips/$z.zip; unzip -qo /tmp/zips/$z.zip -d /tmp/rec; echo "unzip $z $?"
          done
          bajar() { curl -sSfL --retry 2 -o /tmp/zips/$1.zip "$2" || curl -sSfL --retry 2 -o /tmp/zips/$1.zip "${2/files2./files.}"; unzip -qo /tmp/zips/$1.zip -d /tmp/rec && echo "OK $1" || echo "FALLO $1"; }
          bajar faceunits01 https://files2.makehumancommunity.org/functional/faceunits01.zip
          for u in dress01 skirts01; do bajar $u https://files2.makehumancommunity.org/asset_packs/$u/${u}_cc0.zip; done
          for u in dress02 dress03; do bajar $u https://files2.makehumancommunity.org/asset_packs/$u/${u}_ccby.zip; done
          mkdir -p out/elena/miniaturas; for f in /tmp/rec/clothes/*/*.thumb; do cp "$f" "out/elena/miniaturas/$(basename $(dirname $f)).png"; done
          find /tmp/rec -maxdepth 2 -type d | sort | head -150
          ls /tmp/rec
          python engine/tools/elena_mh/instalar_mpfb.py /tmp/mpfb.zip /tmp/rec 2>&1 | tail -20
          exit 0
      - name: Crear a Elena
        run: python engine/tools/elena_mh/crear_elena.py out/elena 2>&1 | grep -vE "^Fra|Sample" | tail -150 | tee out/elena/creacion.txt
      - name: Guardar en la rama aether-elena
        if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b aether-elena
          git config user.name "aether-ci" && git config user.email "ci@aethercode.local"
          git add -A && git commit -qm "Elena MH ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aether-elena

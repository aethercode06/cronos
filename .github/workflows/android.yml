name: Compilar APK de Android
on:
  push:
    branches: [ main ]
    paths: [ 'www/**', 'assets/**', 'keys/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar Capacitor
        run: npm install
      - name: Crear el proyecto Android
        run: |
          mkdir -p ../extra && mv www/prueba.html ../extra/prueba.html || true
          npx cap add android
          npx cap sync android
      - name: Icono y pantalla de carga del juego
        continue-on-error: true
        run: |
          [ -f assets/splash-dark.png ] || cp assets/splash.png assets/splash-dark.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0e081a' --iconBackgroundColorDark '#0e081a' --splashBackgroundColor '#07050f' --splashBackgroundColorDark '#07050f'
      - name: Horizontal, pantalla completa y número de versión
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $((1000 + ${{ github.run_number }}))/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.4.${{ github.run_number }}\"/" $G
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item>\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' $S
      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chronos-The-Shift.apk
      - name: Versión de prueba (todos los mundos abiertos, se instala aparte)
        run: |
          cp ../extra/prueba.html www/index.html
          npx cap sync android
          G=android/app/build.gradle
          sed -i 's/applicationId "com.aethercode.chronos"/applicationId "com.aethercode.chronos.prueba"/' $G
          R=android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Chronos PRUEBA</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Chronos PRUEBA</string>#' $R
          grep -n applicationId $G
          cd android && ./gradlew assembleDebug --no-daemon && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Chronos-PRUEBA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-apk
          path: Chronos-The-Shift.apk
      - name: Publicar en Descargas (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version -y --cleanup-tag || true
          gh release create ultima-version Chronos-The-Shift.apk Chronos-PRUEBA.apk \
            --title "Chronos & The Shift · versión 2.4.${{ github.run_number }}" \
            --notes "Toca **Chronos-The-Shift.apk** para descargarlo e instalarlo en Android. **Chronos-PRUEBA.apk** es la versión de prueba con todos los mundos abiertos: se instala aparte y no toca tu partida. Si el teléfono lo pide, permite instalar apps de origen desconocido para tu navegador." \
            --latest

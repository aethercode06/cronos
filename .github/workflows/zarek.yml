name: La Sombra de Zarek (Aether Engine)
on:
  push:
    branches: [ main ]
    paths: [ 'engine/zarek/**', 'engine/addons/aether/three_d/aether_player_fp.gd', 'engine/addons/aether/ui/aether_touch_fp.gd', 'engine/addons/aether/core/aether_synth.gd', 'engine/export_presets.cfg', '.github/workflows/zarek.yml' ]
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Descargar Godot y plantillas de exportación
        run: |
          V=$GODOT_VERSION
          cd $RUNNER_TEMP
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          unzip -q Godot_v${V}-stable_linux.x86_64.zip
          sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q Godot_v${V}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${V}.stable/
          godot --version
      - name: Configurar Android en el editor
        run: |
          MM=$(echo $GODOT_VERSION | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${MM}.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/engine/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          sed -i 's/^ *//' ~/.config/godot/*.tres
          cat ~/.config/godot/editor_settings-4.tres
      - name: Importar el proyecto
        run: |
          godot --headless --path engine --import > import.log 2>&1 || true
          tail -60 import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log
      - name: Prueba automática de la Noche I
        run: |
          timeout 300 godot --headless --path engine --fixed-fps 60 res://zarek/prueba.tscn > zarek.log 2>&1 || true
          cat zarek.log | grep -v "^$" | tail -40
          grep -q "ZAREK OK" zarek.log
          ! grep -E "SCRIPT ERROR|Parse Error" zarek.log
      - name: Capturas de pantalla
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p zarek_shots
          SHOTS_DIR=$PWD/zarek_shots timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path engine --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1280x720 res://zarek/prueba.tscn -- --capturas > shots.log 2>&1 || true
          ls -la zarek_shots
      - name: Exportar APK de Android
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/engine/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" engine/export_presets.cfg
          godot --headless --path engine --export-debug "Android Zarek" ../build/LaSombraDeZarek.apk > export.log 2>&1 || true
          tail -30 export.log
          ls -la build
          test -s build/LaSombraDeZarek.apk
      - name: Publicar en Descargas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete zarek -y --cleanup-tag || true
          gh release create zarek build/LaSombraDeZarek.apk \
            --title "La Sombra de Zarek · Noche I (1.0.${{ github.run_number }})" \
            --notes "**La Sombra de Zarek — Noche I**, hecho con Aether Engine. Toca **LaSombraDeZarek.apk** para instalarlo. Usa auriculares." \
            --latest=false
          for i in 1 2 3 4 5; do
            gh release edit zarek --draft=false || true
            sleep 4
            if [ "$(gh release view zarek --json isDraft -q .isDraft)" = "false" ]; then echo "publicada"; break; fi
          done
      - name: Guardar registros y capturas en la rama zarek-logs
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r zarek_shots /tmp/out/ 2>/dev/null || true
          cp *.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b zarek-logs
          git config user.name "aether-ci" && git config user.email "ci@aethercode.local"
          git add -A && git commit -qm "Registros de la ejecución ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" zarek-logs

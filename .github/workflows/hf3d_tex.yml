name: Imagen a 3D con textura PBR (Hugging Face)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/tools/hf3d/hf3d_tex.py"
      - "engine/tools/hf3d/buscar_spaces.py"
      - "engine/tools/hf3d/entrada_tex/**"
      - ".github/workflows/hf3d_tex.yml"

permissions:
  contents: write

jobs:
  modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engine/tools/hf3d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client pillow huggingface_hub
      - name: Generar modelos con textura
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF3D_SPACES: ${{ vars.HF3D_SPACES || 'prithivMLmods/TRELLIS.2-Text-to-3D,cpuai/TRELLIS-2,henrybit/TRELLIS-2-4B-Demo' }}
        run: |
          mkdir -p out
          for img in engine/tools/hf3d/entrada_tex/*.png; do
            n=$(basename "$img" .png)
            python engine/tools/hf3d/hf3d_tex.py "$img" "out/$n" || true
          done
          find out -type f | head -50
      - name: Guardar en la rama aether-3d-tex
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b aether-3d-tex
          git config user.name "aether-ci" && git config user.email "ci@aethercode.local"
          git add -A && git commit -qm "Modelos 3D con textura ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aether-3d-tex

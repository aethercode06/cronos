name: Prueba del emulador (diagnóstico)
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Godot y escena de control
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/engine/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          V=$GODOT_VERSION; cd $RUNNER_TEMP
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          unzip -q Godot_v${V}-stable_linux.x86_64.zip; sudo mv Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable; unzip -q Godot_v${V}-stable_export_templates.tpz; mv templates/* ~/.local/share/godot/export_templates/${V}.stable/
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/engine/keys/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" "$GITHUB_WORKSPACE" > ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres
          cd $GITHUB_WORKSPACE
          # proyecto mínimo aparte: solo la escena de control
          mkdir -p /tmp/p && cp engine/export_presets.cfg engine/project.godot /tmp/p/ && cp -r engine/keys /tmp/p/ && mkdir -p /tmp/p/zarek /tmp/p/addons/aether/core
          cp engine/zarek/vacio3d.* /tmp/p/zarek/ && cp engine/addons/aether/core/aether_synth.gd /tmp/p/addons/aether/core/
          cp -r engine/zarek/icono /tmp/p/zarek/ 2>/dev/null || true
          sed -i 's#^run/main_scene.zarek=.*#run/main_scene.zarek="res://zarek/vacio3d.tscn"#' /tmp/p/project.godot
          sed -i '/^\[autoload\]/,/^\[/{/^Aether=/d}' /tmp/p/project.godot
          python3 - <<'PY'
          p='/tmp/p/export_presets.cfg'; s=open(p).read()
          i=s.index('name="Android Zarek"'); j=s.find('[preset.', i)
          seg=s[i:j if j>0 else len(s)].replace('architectures/x86_64=false','architectures/x86_64=true').replace('architectures/arm64-v8a=true','architectures/arm64-v8a=false')
          open(p,'w').write(s[:i]+seg+(s[j:] if j>0 else ''))
          PY
          godot --headless --path /tmp/p --import > imp.log 2>&1 || true
          mkdir -p build; godot --headless --path /tmp/p --export-release "Android Zarek" $PWD/build/control.apk > exp.log 2>&1 || true
          tail -5 exp.log; ls -la build
      - uses: actions/upload-artifact@v4
        with: { name: control, path: build/control.apk }
  emu:
    needs: control
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 34]
        gpu: [swiftshader_indirect, guest]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: control, path: build }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador
        run: |
          SDKM=$(ls $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager | head -1)
          for i in 1 2 3 4 5; do yes | $SDKM --install "emulator" "platform-tools" "system-images;android-${{ matrix.api }};google_apis;x86_64" > /dev/null 2>&1 && break; sleep 15; done
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r build/control.apk
            adb logcat -c
            adb shell monkey -p com.aethercode.zarek -c android.intent.category.LAUNCHER 1
            sleep 45
            adb shell pidof com.aethercode.zarek || echo MUERTO
            adb logcat -d | grep -E "ZAREK|F libc|I godot" | tail -12

name: Publicar versión web
on:
  push:
    branches: [ main ]
    paths: [ 'www/**', '.github/workflows/web.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir www a la rama gh-pages
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Versión web ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

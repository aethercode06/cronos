name: Árboles Ez-Tree
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/tools/eztree/**", ".github/workflows/eztree.yml"]
permissions:
  contents: write
jobs:
  arboles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Generar
        run: |
          set +e
          mkdir -p /tmp/gen/out && cp engine/tools/eztree/generar.mjs /tmp/gen/ && cd /tmp/gen
          npm init -y > /dev/null; npm i three @dgreenheck/ez-tree > out/npm.txt 2>&1
          ls node_modules/@dgreenheck/ez-tree/build >> out/npm.txt 2>&1
          node generar.mjs out > out/registro.txt 2>&1
          echo "salida $?" >> out/registro.txt
          # texturas de corteza (ambientCG, CC0) y hojas del repositorio de Ez-Tree (MIT)
          git clone -q --depth 1 https://github.com/dgreenheck/ez-tree /tmp/ezsrc && cd /tmp/ezsrc && git lfs pull --include="src/app/public/textures/**"
          mkdir -p /tmp/gen/out/texturas && cp -r src/app/public/textures/leaves src/app/public/textures/LICENSE.md /tmp/gen/out/texturas/
          mkdir -p /tmp/gen/out/texturas/bark && for b in Bark001 Bark003 Bark007 Bark013; do cp -r src/app/public/textures/bark/${b}_1K-JPG /tmp/gen/out/texturas/bark/; done
          cp LICENSE /tmp/gen/out/texturas/LICENSE_ez-tree.txt
          true
      - name: Publicar en la rama aether-eztree
        run: |
          cd /tmp/gen/out
          git init -q && git checkout -q -b aether-eztree
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Ez-Tree $GITHUB_RUN_NUMBER"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" aether-eztree

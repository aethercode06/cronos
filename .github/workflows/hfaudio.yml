name: Sonido gratis (Hugging Face y Kokoro)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/tools/hfaudio/**"
      - ".github/workflows/hfaudio.yml"

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engine/tools/hfaudio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q gradio_client soundfile "kokoro>=0.9" 2>&1 | tail -3
      - name: Voces (Kokoro, en el propio servidor)
        continue-on-error: true
        run: python engine/tools/hfaudio/voces.py engine/tools/hfaudio/voces.json out/voces
      - name: Efectos y música (Stable Audio Open en Spaces)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python engine/tools/hfaudio/hfaudio.py engine/tools/hfaudio/pedidos.json out/sfx
      - name: Guardar en la rama aether-audio
        if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b aether-audio
          git config user.name "aether-ci" && git config user.email "ci@aethercode.local"
          git add -A && git commit -qm "Audio ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aether-audio

name: Modelos CC0 (Poly Haven)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/tools/modelos/**", ".github/workflows/modelos.yml"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engine/tools/modelos
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pillow
      - run: |
          set +e
          mkdir -p out
          python engine/tools/modelos/polyhaven.py lista out 2>&1 | tail -20
          python engine/tools/modelos/polyhaven.py bajar engine/tools/modelos/pedidos.json out/modelos > out/registro.txt 2>&1 || true
          du -sh out/modelos/* >> out/registro.txt 2>&1 || true
          find out -size +90M >> out/registro.txt
      - name: Subir como paquete a la release «modelos-cc0»
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && tar czf /tmp/modelos.tar.gz modelos registro.txt modelos.json hoja.jpg 2>/dev/null; ls -la /tmp/modelos.tar.gz
          gh release view modelos-cc0 -R ${{ github.repository }} >/dev/null 2>&1 || gh release create modelos-cc0 -R ${{ github.repository }} -t "Modelos CC0 (Poly Haven)" -n "Muebles y decorado CC0 para La Sombra de Zarek"
          gh release upload modelos-cc0 /tmp/modelos.tar.gz registro.txt -R ${{ github.repository }} --clobber

name: Gravity Thief APK
on:
  push:
    branches: [gravity-thief-apk]
    paths: ["apk/**", ".github/workflows/gravity-thief.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unir las partes en un solo APK
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          7z x apk/GravityThief-v10.7z.001 -oout -y
          ls -la out
      - name: Publicar en la release gravity-thief
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gravity-thief -y --cleanup-tag || true
          gh release create gravity-thief out/GravityThief.apk \
            --target "${GITHUB_SHA}" \
            --title "Gravity Thief v3.0.0" \
            --notes "APK completo de Gravity Thief (Aether Code). Descarga GravityThief.apk e instalalo."
